[package]
name = "xuanxue-core"
version = "0.1.0"
edition = "2021"
description = "High-performance, lightweight metaphysics and astronomical engine in pure Rust (Zero Java/Node/SQLite dependencies)"

[dependencies]
memmap2 = "0.9"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
vsop87 = "3.0.0"
lzma-rs = "0.3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
