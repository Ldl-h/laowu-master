[package]
name = "laowu-master"
version = "0.2.0"
edition = "2021"
description = "老吴大师（哈基仙版）- 极速、脱水、纯 Rust 离线天文占星与东方玄学算力引擎 (Zero Java/Node/SQLite dependencies)"

[dependencies]
memmap2 = "0.9"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
vsop87 = "3.0.0"
lzma-rs = "0.3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
